on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  style_lint:
    name: Lint style
    runs-on: ubuntu-latest
    steps:
      - name: Check for long lines
        if: always()
        run: |
          ! (find Polya -name "*.lean" -type f -exec grep -E -H -n '^.{101,}$' {} \; | grep -v -E 'https?://')

      - name: Don't 'import Mathlib', use precise imports
        if: always()
        run: |
          ! (find Polya -name "*.lean" -type f -print0 | xargs -0 grep -E -n '^import Mathlib$')

  build:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Install elan
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:4.0.0

      - name: Restore Lake package cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/VersoBlueprint
            .lake/packages/mathlib
            .lake/packages/subverso
            .lake/packages/verso
          key: ${{ runner.os }}-lake-packages-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v2-
      - name: Restore root Lean build cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/build/lib
            .lake/build/ir
          key: ${{ runner.os }}-lean-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '.gitmodules', '*.lean', '**/*.lean', 'scripts/ci-pages.sh') }}
          restore-keys: |
            ${{ runner.os }}-lean-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '.gitmodules') }}-
            ${{ runner.os }}-lean-build-v2-
      - if: ${{ inputs.harness_enabled }}
        name: Restore formalization Lean build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.harness.outputs.formalization_path }}/.lake/build/lib
            ${{ steps.harness.outputs.formalization_path }}/.lake/build/ir
          key: ${{ runner.os }}-formalization-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '.gitmodules', '*.lean', '**/*.lean', 'scripts/ci-pages.sh') }}
          restore-keys: |
            ${{ runner.os }}-formalization-build-v1-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', '.gitmodules') }}-
            ${{ runner.os }}-formalization-build-v1-

      - name: Get cache
        run: ~/.elan/bin/lake exe cache get || true

      - name: Build project
        run: |
          ~/.elan/bin/lake build
          ~/.elan/bin/lake env lean --run BlueprintMain.lean --verbose --output _out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _out/html-multi

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
